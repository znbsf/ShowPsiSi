name: Native engine and web workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official TSDuck SDK
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck-dev_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build
      - name: Build native engine
        run: |
          cmake -S . -B build -G Ninja -DBUILD_QT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Engine, protocol and transport tests
        run: |
          python scripts/make_fixture.py
          python -m unittest discover -s tests -p test_engine.py -v
          python -m unittest discover -s tests -p test_protocol_coverage.py -v
          python -m unittest discover -s tests -p test_cloud_preview.py -v
      - name: Real Chromium with native engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p test_web_ui.py -v
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: artifacts/web-ui-tests
          if-no-files-found: ignore
  qt-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official SDK and Qt dependencies
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck-dev_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build libgl1-mesa-dev libxkbcommon-dev
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 --outputdir .deps/Qt --archives qtbase qtdeclarative qtsvg qttools icu
      - name: Build and exercise compiled Qt workbench
        run: |
          export LD_LIBRARY_PATH="$PWD/.deps/Qt/6.7.3/gcc_64/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$PWD/.deps/Qt/6.7.3/gcc_64" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python scripts/make_fixture.py
          SHOWPSISI_QT="$PWD/build/bin/showpsisi-qt" python -m unittest discover -s tests -p test_qt_ui.py -v
  tauri-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev pkg-config
          rustup toolchain install 1.99.1 --profile minimal
      - name: Compile native shell and test URL restrictions
        run: cargo +1.99.1 test --locked --manifest-path ui/tauri/src-tauri/Cargo.toml
