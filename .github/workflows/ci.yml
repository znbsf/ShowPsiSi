name: Native engine and web workbench
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  engine-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official TSDuck SDK
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck-dev_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build
      - name: Build native engine
        run: |
          cmake -S . -B build -G Ninja -DBUILD_QT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Engine, protocol and transport tests
        run: |
          python scripts/make_fixture.py
          python -m unittest discover -s tests -p test_engine.py -v
          python -m unittest discover -s tests -p test_protocol_coverage.py -v
          python -m unittest discover -s tests -p test_cloud_preview.py -v
      - name: Real Chromium with native engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p test_web_ui.py -v
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: artifacts/web-ui-tests
          if-no-files-found: ignore
