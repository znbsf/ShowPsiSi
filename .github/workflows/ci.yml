name: Native engine and web workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHOWPSISI_CORE: ${{ github.workspace }}/build/bin/showpsisi-core
      SHOWPSISI_TEST_CORE: ${{ github.workspace }}/build/bin/showpsisi-core-test
      # Ubuntu's existing Chrome profile supports this official installed binary.
      # The runner's unpacked /usr/bin/chromium snapshot has no matching profile.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer packaging contract regressions
        run: python -m unittest discover -s tests -p test_installer_package.py -v
      - name: Workbench text and control contrast regression
        run: python -m unittest discover -s tests -p test_ui_contrast.py -v
      - name: Install pinned official TSDuck SDK
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.45-4798/tsduck_3.45-4798.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.45-4798/tsduck-dev_3.45-4798.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          echo '0023689f76e75b64e45253771208bcf8ca95b91fbfd0900da097c729f3c39fde  /tmp/tsduck.deb' | sha256sum --check --strict
          echo '0bfbec4234065bbabd42271b87d8f61f5f1b5169c31e797a2f5952fa736192c2  /tmp/tsduck-dev.deb' | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build
      - name: Build native engine
        run: |
          cmake -S . -B build -G Ninja -DBUILD_QT_UI=OFF -DSHOWPSISI_BUILD_CANCELLATION_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Engine, protocol and transport tests
        run: |
          python scripts/make_fixture.py
          python scripts/ci/windows_native_checks.py --artifacts artifacts/linux-native --engine
      - name: Prepare browser validation dependencies
        run: |
          python -m pip install playwright
          python -m playwright install-deps chromium
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" --version
      - name: Preflight sandbox-enabled browser startup
        run: |
          mkdir -p artifacts/web-ui-tests
          python - <<'PY' 2>&1 | tee artifacts/web-ui-tests/browser-environment.log
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          executable = os.environ["PLAYWRIGHT_CHROMIUM_EXECUTABLE"]
          print(json.dumps({"executable": executable, "resolved_path": str(Path(executable).resolve()),
                            "chromium_sandbox": True}), flush=True)
          with sync_playwright() as playwright:
              with playwright.chromium.launch(headless=True, executable_path=executable,
                                               chromium_sandbox=True) as browser:
                  page = browser.new_page()
                  page.goto("about:blank")
                  assert page.evaluate("1 + 1") == 2
                  print(json.dumps({"browser_version": browser.version,
                                    "sandbox_enabled_startup": "passed"}), flush=True)
          PY
      - name: Real Chromium with native engine
        run: |
          python -m unittest discover -s tests -p test_web_ui.py -v
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: artifacts/web-ui-tests
          if-no-files-found: ignore
      - name: Keep strict native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-validation
          path: artifacts/linux-native
          if-no-files-found: warn
          retention-days: 14
  qt-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHOWPSISI_CORE: ${{ github.workspace }}/build/bin/showpsisi-core
      SHOWPSISI_TEST_CORE: ${{ github.workspace }}/build/bin/showpsisi-core-test
      SHOWPSISI_QT: ${{ github.workspace }}/build/bin/showpsisi-qt
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official SDK and Qt dependencies
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.45-4798/tsduck_3.45-4798.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.45-4798/tsduck-dev_3.45-4798.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          echo '0023689f76e75b64e45253771208bcf8ca95b91fbfd0900da097c729f3c39fde  /tmp/tsduck.deb' | sha256sum --check --strict
          echo '0bfbec4234065bbabd42271b87d8f61f5f1b5169c31e797a2f5952fa736192c2  /tmp/tsduck-dev.deb' | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build libgl1-mesa-dev libxkbcommon-dev
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 --outputdir .deps/Qt --archives qtbase qtdeclarative qtsvg qttools icu
      - name: Build and exercise compiled Qt workbench
        run: |
          export LD_LIBRARY_PATH="$PWD/.deps/Qt/6.7.3/gcc_64/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$PWD/.deps/Qt/6.7.3/gcc_64" -DSHOWPSISI_BUILD_CANCELLATION_TESTS=ON -DSHOWPSISI_BUILD_UPDATER_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python scripts/make_fixture.py
          ctest --test-dir build --output-on-failure --no-tests=error -R updater
          python scripts/ci/windows_native_checks.py --artifacts artifacts/linux-qt --qt
      - name: Keep strict Qt regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-qt-validation
          path: artifacts/linux-qt
          if-no-files-found: warn
          retention-days: 14
  tauri-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev pkg-config
          rustup toolchain install 1.99.1 --profile minimal
      - name: Compile native shell and test URL restrictions
        run: cargo +1.99.1 test --locked --manifest-path ui/tauri/src-tauri/Cargo.toml
  windows-native:
    name: Windows MSVC engine and Qt
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check hosted Inno compiler engine and installer contracts
        run: |
          python scripts/ci/inno_compiler.py --compiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_installer_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/windows_shortcuts.py --artifacts artifacts/installer-shortcut-probe
      - name: Extract pinned TSDuck SDK and install Qt 6.7.3
        run: ./scripts/ci/windows.ps1 -Phase Dependencies
      - name: Build MSVC engine and deploy Qt runtime
        id: build
        run: ./scripts/ci/windows.ps1 -Phase Build
      - name: Qt update-client security and version tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $env:PATH = "$PWD/.deps/Qt/6.7.3/msvc2019_64/bin;$PWD/build/windows/bin/Release;$env:PATH"
          ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error -R updater
      - name: Windows engine, protocol and transport regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/ci/windows.ps1 -Phase EngineTests
      - name: Native Qt offscreen interaction regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/ci/windows.ps1 -Phase QtTests
      - name: Prepare portable packaging checks
        run: python -m pip install pefile==2024.8.26 psutil==7.0.0
      - name: Stage production-only Qt portable candidate
        run: |
          $commit = (git rev-parse HEAD).Trim()
          ./scripts/package-windows.ps1 -BuildBin "$PWD/build/windows/bin/Release" -Qt "$PWD/.deps/Qt/6.7.3/msvc2019_64" -Sdk "$PWD/.deps/TSDuck-3.45-4798" -Output "$PWD/artifacts/portable-stage" -LicenseBundle "$PWD/scripts/portable-licenses" -SourceCommit $commit -Python (Get-Command python).Source
      - name: Validate relocated portable candidate without SDK PATH
        run: python scripts/ci/portable_checks.py validate --package artifacts/portable-stage --artifacts artifacts/portable-validation --qt .deps/Qt/6.7.3/msvc2019_64
      - name: Gate binary ZIP on exact runtime and redistribution review
        id: portable
        run: |
          python scripts/ci/portable_checks.py archive --package artifacts/portable-stage --artifacts artifacts/portable-validation --output artifacts/ShowPsiSi-windows-x64-qt.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ready = Test-Path artifacts/ShowPsiSi-windows-x64-qt.zip
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) { "Portable binary upload blocked by runtime or redistribution review. See portable-validation/distribution-gate.json." >> $env:GITHUB_STEP_SUMMARY }
      - name: Verify official Microsoft runtime download without executing it
        if: ${{ success() && steps.portable.outputs.ready == 'true' }}
        run: ./scripts/prepare-windows-prerequisite.ps1 -Output "$PWD/.deps/installer-prerequisite"
      - name: Build per-user installer from exact reviewed payload
        id: installer
        if: ${{ success() && steps.portable.outputs.ready == 'true' }}
        run: |
          ./scripts/package-installer.ps1 -Package "$PWD/artifacts/portable-stage" -Validation "$PWD/artifacts/portable-validation" -PrerequisiteDirectory "$PWD/.deps/installer-prerequisite" -Output "$PWD/artifacts/installer-candidate" -Work "$PWD/artifacts/installer-build" -Python (Get-Command python).Source -CreateUpgradeFixture
      - name: Install, upgrade, repair and uninstall in a Unicode path
        id: installer_smoke
        if: ${{ success() && steps.installer.outcome == 'success' }}
        run: |
          $record = Get-Content artifacts/installer-candidate/installer-build.json -Raw | ConvertFrom-Json
          python scripts/ci/installer_checks.py smoke --package artifacts/portable-stage --artifacts artifacts/installer-validation --version $record.version --installer "artifacts/installer-candidate/$($record.asset_name)" --previous artifacts/installer-build/test-only/TEST-ONLY-previous-version.exe
      - name: Keep verified Windows installer candidate (never publish a release)
        if: ${{ success() && steps.installer_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShowPsiSi-windows-x64-installer
          path: |
            artifacts/installer-candidate/ShowPsiSi-*-windows-x64-setup.exe
            artifacts/installer-candidate/SHA256SUMS
            artifacts/installer-candidate/installer-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep installer validation and prerequisite provenance (no Microsoft binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-validation
          path: |
            artifacts/installer-validation
            artifacts/installer-shortcut-probe
            artifacts/installer-candidate/installer-build.json
            .deps/installer-prerequisite/vc-runtime.json
          if-no-files-found: warn
          retention-days: 14
      - name: Keep cleared portable CI artifact (never publish a release)
        if: ${{ success() && steps.portable.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShowPsiSi-windows-x64-qt
          path: |
            artifacts/ShowPsiSi-windows-x64-qt.zip
            artifacts/ShowPsiSi-windows-x64-qt.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Keep portable validation evidence (no runtime binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-validation
          path: |
            artifacts/portable-validation
            artifacts/portable-stage/manifest.json
            artifacts/portable-stage/build-information.json
          if-no-files-found: warn
          retention-days: 14
      - name: Collect SDK and native DLL diagnostics
        if: always()
        run: ./scripts/ci/windows.ps1 -Phase Diagnostics
      - name: Keep Windows native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-validation
          path: |
            artifacts/windows-native
            build/windows/CMakeCache.txt
            build/windows/CMakeFiles/CMakeConfigureLog.yaml
            aqtinstall.log
          if-no-files-found: warn
          retention-days: 14
  windows-tauri-build:
    name: Windows Tauri compile and Rust tests
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native prerequisites and install pinned official Rust
        run: ./scripts/ci/windows_tauri.ps1 -Phase Setup
      - name: Compile and execute locked release Rust unit tests
        timeout-minutes: 20
        run: ./scripts/ci/windows_tauri.ps1 -Phase Test
      - name: Build the release Windows Tauri executable
        timeout-minutes: 10
        run: ./scripts/ci/windows_tauri.ps1 -Phase Build
      - name: Collect native compiler and DLL diagnostics
        if: always()
        run: ./scripts/ci/windows_tauri.ps1 -Phase Diagnostics
      - name: Keep Windows Tauri compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-compile-validation
          path: artifacts/windows-tauri
          if-no-files-found: warn
          retention-days: 14
