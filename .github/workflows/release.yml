name: Publish verified ShowPsiSi release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed current main commit with successful main-push CI
        required: true
        type: string
      ci_run_id:
        description: Successful main-push ci.yml run ID for this commit
        required: true
        type: string
  push:
    branches: ['release-publish/**']
    paths: [.github/release-request.json]
permissions: {}
concurrency:
  group: ShowPsiSi-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'znbsf/ShowPsiSi'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      # Always execute main's reviewed publisher, never code from the request branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Publisher security contract regressions
        run: python -m unittest discover -s tests -p test_release_publisher.py -v
      - name: Verify exact CI artifacts, stage draft, verify uploads and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/release_publisher.py
