name: Native engine and web workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHOWPSISI_CORE: ${{ github.workspace }}/build/bin/showpsisi-core
      SHOWPSISI_TEST_CORE: ${{ github.workspace }}/build/bin/showpsisi-core-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official TSDuck SDK
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck-dev_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build
      - name: Build native engine
        run: |
          cmake -S . -B build -G Ninja -DBUILD_QT_UI=OFF -DSHOWPSISI_BUILD_CANCELLATION_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Engine, protocol and transport tests
        run: |
          python scripts/make_fixture.py
          python scripts/ci/windows_native_checks.py --artifacts artifacts/linux-native --engine
      - name: Real Chromium with native engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p test_web_ui.py -v
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: artifacts/web-ui-tests
          if-no-files-found: ignore
      - name: Keep strict native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-validation
          path: artifacts/linux-native
          if-no-files-found: warn
          retention-days: 14
  qt-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHOWPSISI_CORE: ${{ github.workspace }}/build/bin/showpsisi-core
      SHOWPSISI_TEST_CORE: ${{ github.workspace }}/build/bin/showpsisi-core-test
      SHOWPSISI_QT: ${{ github.workspace }}/build/bin/showpsisi-qt
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official SDK and Qt dependencies
        run: |
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck.deb
          curl --fail --location --retry 3 https://github.com/tsduck/tsduck/releases/download/v3.39-3956/tsduck-dev_3.39-3956.ubuntu24_amd64.deb -o /tmp/tsduck-dev.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tsduck.deb /tmp/tsduck-dev.deb ninja-build libgl1-mesa-dev libxkbcommon-dev
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.7.3 linux_gcc_64 --outputdir .deps/Qt --archives qtbase qtdeclarative qtsvg qttools icu
      - name: Build and exercise compiled Qt workbench
        run: |
          export LD_LIBRARY_PATH="$PWD/.deps/Qt/6.7.3/gcc_64/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$PWD/.deps/Qt/6.7.3/gcc_64" -DSHOWPSISI_BUILD_CANCELLATION_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          python scripts/make_fixture.py
          python scripts/ci/windows_native_checks.py --artifacts artifacts/linux-qt --qt
      - name: Keep strict Qt regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-qt-validation
          path: artifacts/linux-qt
          if-no-files-found: warn
          retention-days: 14
  tauri-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev pkg-config
          rustup toolchain install 1.99.1 --profile minimal
      - name: Compile native shell and test URL restrictions
        run: cargo +1.99.1 test --locked --manifest-path ui/tauri/src-tauri/Cargo.toml
  windows-native:
    name: Windows MSVC engine and Qt
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract pinned TSDuck SDK and install Qt 6.7.3
        run: ./scripts/ci/windows.ps1 -Phase Dependencies
      - name: Build MSVC engine and deploy Qt runtime
        id: build
        run: ./scripts/ci/windows.ps1 -Phase Build
      - name: Windows engine, protocol and transport regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/ci/windows.ps1 -Phase EngineTests
      - name: Native Qt offscreen interaction regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/ci/windows.ps1 -Phase QtTests
      - name: Collect SDK and native DLL diagnostics
        if: always()
        run: ./scripts/ci/windows.ps1 -Phase Diagnostics
      - name: Keep Windows native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-validation
          path: |
            artifacts/windows-native
            build/windows/CMakeCache.txt
            build/windows/CMakeFiles/CMakeConfigureLog.yaml
            aqtinstall.log
          if-no-files-found: warn
          retention-days: 14
  windows-tauri-build:
    name: Windows Tauri compile and Rust tests
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native prerequisites and install pinned official Rust
        run: ./scripts/ci/windows_tauri.ps1 -Phase Setup
      - name: Compile and execute locked release Rust unit tests
        timeout-minutes: 20
        run: ./scripts/ci/windows_tauri.ps1 -Phase Test
      - name: Build the release Windows Tauri executable
        timeout-minutes: 10
        run: ./scripts/ci/windows_tauri.ps1 -Phase Build
      - name: Collect native compiler and DLL diagnostics
        if: always()
        run: ./scripts/ci/windows_tauri.ps1 -Phase Diagnostics
      - name: Keep Windows Tauri compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-compile-validation
          path: artifacts/windows-tauri
          if-no-files-found: warn
          retention-days: 14
